{{- if .Values.homeassistant.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homeassistant.fullname" . }}
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.homeassistant.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.homeassistant.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.homeassistant.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $.Values.homeassistant.hostname }}
      secretName: {{ . }}
  {{- end }}
  rules:
  - host: {{ .Values.homeassistant.hostname }}
    http:
      paths:
      - path: /
        backend:
          service:
            name: {{ include "homeassistant.fullname" . }}
            port:
              name: http
        pathType: Prefix
{{- end }}
