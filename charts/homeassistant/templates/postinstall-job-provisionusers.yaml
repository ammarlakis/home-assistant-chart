{{- $adminSecret := .Values.homeassistant.adminSecret | required ".Values.homeassistant.adminSecret is required." -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "homeassistant.fullname" . }}-provision-users
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation, hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "homeassistant.fullname" . }}
      labels:
        {{- include "homeassistant.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
      - name: provision-users
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
        - >
          set -x;
          echo "Waiting for home-assistant to start up ...";
          retries=0;
          max_retries=40;
          status=000;
          while [ "$retries" -lt "$max_retries" ]; do
            status=$(curl -L --connect-timeout 5 -sw '%{http_code}' "http://{{ include "homeassistant.fullname" . }}.{{ .Release.Namespace }}/" -o /dev/null || echo 000);
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              break;
            fi;
            echo "Home Assistant not ready yet (status: $status). Retrying in 15s ($retries/$max_retries) ...";
            retries=$((retries+1));
            sleep 15;
          done;
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Home Assistant did not become ready in time (final status: $status). Aborting provisioning.";
            exit 1;
          fi;
          echo "Home Assistant is up and running.";
          echo "Creating admin user ..";
          curl --location --request POST 'http://{{ include "homeassistant.fullname" . }}.{{ .Release.Namespace }}/api/onboarding/users'
          --header 'Content-Type: application/json'
          --data-raw '{
            "client_id": "http://{{ include "homeassistant.fullname" . }}.{{ .Release.Namespace }}/",
            "name": "admin",
            "username": "'"$USERNAME"'",
            "password": "'"$PASSWORD"'",
            "language": "en"
          }';
        env:
        - name: USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ $adminSecret }}
              key: USERNAME
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $adminSecret }}
              key: PASSWORD
